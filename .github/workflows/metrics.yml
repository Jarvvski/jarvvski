name: metrics

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:        # allow manual runs
  push:
    branches: [master]      # regenerate when the profile changes

# A later run waits, then replaces the metrics branch. Runs must not
# append commits, on master or on metrics.
concurrency:
  group: metrics
  cancel-in-progress: false

permissions:
  contents: write           # force-update the metrics branch; master is not written

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # Classic PAT with scopes: repo + read:org + read:user, SSO-authorised
          # for the amebaai org so private/work activity is counted.
          # Stored as the METRICS_TOKEN repo secret.
          token: ${{ secrets.METRICS_TOKEN }}
          user: Jarvvski
          filename: github-metrics.svg
          # `commit` (the default) and `committer_branch` both append a commit
          # per run, and GitHub counts every branch toward repository size.
          # `none` only writes /metrics_renders/github-metrics.svg. The next
          # step publishes that file as one orphan commit.
          # https://github.com/lowlighter/metrics/blob/master/source/plugins/core/README.md
          output_action: none
          template: classic
          config_timezone: Europe/London
          config_display: large       # wider card, fills the profile column
          config_animations: yes

          # Readability: frame the card as a solid panel (it renders transparent by
          # default, so grey text melts into GitHub's dark page). Lift text contrast.
          extras_css: |
            svg { background: #161b22; color: #c9d1d9; }
            h1, h2, h3 { color: #58a6ff; }

          # Keep only the identity header from the base; everything else is curated below.
          base: header

          # Centerpiece: 3D isometric contribution calendar. half-year keeps it compact
          # and legible rather than sprawling diagonally across the whole card.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Polyglot depth: real most-used + recently-used breakdown (Kotlin / Go / Rust / TS).
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_recent_days: 30
          plugin_languages_limit: 8
          plugin_languages_colors: github

          # Tie the card back to the project bullets in the README.
          plugin_repositories: yes
          plugin_repositories_featured: AmebaAI/flint, jarvvski/jjfx, jarvvski/momo

      - name: Publish SVG to the metrics branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          src=/metrics_renders/github-metrics.svg
          sudo test -s "$src"
          work="$(mktemp -d)"
          sudo cp "$src" "$work/github-metrics.svg"
          sudo chown "$(id -u):$(id -g)" "$work/github-metrics.svg"
          git -C "$work" init -b metrics
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add github-metrics.svg
          git -C "$work" commit -m "Update github-metrics.svg - [Skip GitHub Action]"
          # Replace the branch tip. The previous orphan becomes unreachable,
          # so this ref stays one commit and one SVG.
          git -C "$work" push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/metrics
